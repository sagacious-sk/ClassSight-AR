<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ClassSight AI — AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    /* AR information card */
    #arMessage {
      position: fixed;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);

      width: min(90%, 380px);

      padding: 24px;

      border-radius: 22px;

      background: rgba(255, 255, 255, 0.96);

      box-shadow:
        0 15px 50px rgba(0, 0, 0, 0.35);

      text-align: center;

      z-index: 9999;

      display: none;
    }

    /* Logo */
    #arMessage .logo {
      font-size: 25px;
      font-weight: 800;
      color: #142b5f;
      margin-bottom: 8px;
    }

    #arMessage .logo span {
      color: #1688ff;
    }

    /* Description */
    #arMessage p {
      margin: 8px 0 18px;

      color: #555;

      line-height: 1.5;

      font-size: 15px;
    }

    /* Website button */
    #visitWebsite {
      display: inline-block;

      padding: 13px 25px;

      border-radius: 12px;

      background: #1677ff;

      color: #ffffff;

      text-decoration: none;

      font-weight: 700;

      box-shadow:
        0 8px 20px rgba(22, 119, 255, 0.30);

      transition: transform 0.15s ease;
    }

    #visitWebsite:active {
      transform: scale(0.97);
    }

    /* Scan instruction */
    #scanHint {
      position: fixed;

      top: 25px;
      left: 50%;

      transform: translateX(-50%);

      width: max-content;
      max-width: 90%;

      padding: 12px 20px;

      border-radius: 30px;

      background: rgba(0, 0, 0, 0.65);

      color: white;

      font-size: 14px;

      text-align: center;

      z-index: 9998;
    }
  </style>
</head>

<body>

  <!-- Scan instruction -->
  <div id="scanHint">
    Point your camera at the ClassSight AI poster
  </div>


  <!-- =========================
       MINDAR AR SCENE
       ========================= -->

  <a-scene
    mindar-image="
      imageTargetSrc: ./AI%20targets.mind;
      maxTrackables: 1;
    "
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >

    <!-- Camera -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="fuse: false"
    >
    </a-camera>


    <!-- Poster target -->
    <a-entity
      mindar-image-target="targetIndex: 0"
    >
    </a-entity>

  </a-scene>


  <!-- =========================
       AR INFORMATION CARD
       ========================= -->

  <div id="arMessage">

    <div class="logo">
      ClassSight <span>AI</span>
    </div>

    <p>
      See Learning. Build Tomorrow.<br>
      Explore our AI-powered smart classroom platform.
    </p>

    <!--
      CURRENTLY:
      This points to the local ClassSight website.

      IMPORTANT:
      127.0.0.1 means the device opening this link.
      We will replace this with the real website URL later.
    -->

    <a
      id="visitWebsite"
      href="http://127.0.0.1:5000"
      target="_blank"
      rel="noopener noreferrer"
    >
      Visit Website →
    </a>

  </div>


  <script>

    const arMessage =
      document.getElementById("arMessage");

    const scanHint =
      document.getElementById("scanHint");


    const target =
      document.querySelector(
        '[mindar-image-target="targetIndex: 0"]'
      );


    /* =========================
       POSTER DETECTED
       ========================= */

    target.addEventListener("targetFound", () => {

      console.log(
        "ClassSight AI poster detected"
      );

      arMessage.style.display = "block";

      scanHint.style.display = "none";

    });


    /* =========================
       POSTER LOST
       ========================= */

    target.addEventListener("targetLost", () => {

      console.log(
        "ClassSight AI poster lost"
      );

      arMessage.style.display = "none";

      scanHint.style.display = "block";

    });

  </script>

</body>
</html>
